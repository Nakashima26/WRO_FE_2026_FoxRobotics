# Pi 5: /dev/serial0 -> ttyAMA10 (conector de debug). Los GPIO14/15 son ttyAMA0.
# Se corre como MODULO (python -m) desde src/RASPI/cam: runtime_nuevo usa imports relativos.
[Unit]
After=dev-ttyAMA0.device
[Service]
WorkingDirectory=/home/user/FoxRobotics/src/RASPI/cam
Environment=PYTHONUNBUFFERED=1
ExecStart=
ExecStart=/home/user/FoxRobotics/.venv/bin/python -m pure_pursuit.runtime_nuevo --no-window --cam-index 0 --serial-port /dev/ttyAMA0 --threaded-capture --record-orillas --record-output /home/user/FoxRobotics/videos_orillas
